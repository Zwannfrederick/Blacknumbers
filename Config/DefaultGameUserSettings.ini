; Project "Low" preset = engine scalability 1 (Medium) with Lumen, ray tracing and VSM disabled in DefaultEngine.ini.
; Engine level 0 (Low) would remove dynamic shadows entirely, which the mid-2000s look still needs.
; High/Ultra presets will raise these groups (2 = High, 3 = Epic) without touching gameplay code.
[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=1
sg.AntiAliasingQuality=1
sg.ShadowQuality=1
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=1
sg.PostProcessQuality=1
sg.TextureQuality=1
sg.EffectsQuality=1
sg.FoliageQuality=1
sg.ShadingQuality=1
