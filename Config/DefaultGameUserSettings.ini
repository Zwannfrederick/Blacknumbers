; RTX 3050 Ti Laptop (4 GB VRAM, Vulkan) balanced-high defaults: scalability level 2 (High) at native 100% resolution.
; Lumen, hardware ray tracing, and Virtual Shadow Maps stay disabled in DefaultEngine.ini to keep VRAM < 2.5 GB and 75-110+ FPS.
